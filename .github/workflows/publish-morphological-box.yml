name: Publish morphological-box

on:
  push:
    tags:
      - 'morphological-box-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/morphological-box
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - run: npm test
      # Authenticates via npm Trusted Publishing (OIDC, needs id-token: write); no NPM_TOKEN secret required.
      - run: npm publish --access public
